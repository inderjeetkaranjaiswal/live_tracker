name: employee_app
description: "Secure Employee Live Location Tracking Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^10.1.0
  permission_handler: ^11.3.1
  http: ^1.2.1
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
